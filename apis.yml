name: Medivis
description: 'Medivis is a medical technology company building AI-powered augmented reality
  solutions for surgery and medical education. Its flagship product, SurgicalAR, is an FDA
  510(k)-cleared platform that runs on Microsoft HoloLens 2 and transforms 2D medical imaging
  (CT and MRI) into interactive 3D holographic visualizations for surgical planning and
  navigation, including FDA-cleared systems for spine and cranial procedures. Medivis also
  offers AnatomyX, an AR platform for anatomy and medical education. The company reports
  deployment across 40+ institutions and use in 2,000+ surgeries. Medivis is a Microsoft
  technology partner and a portfolio company of Initialized Capital. Medivis publishes no
  public API, developer portal, or SDK; its software surface is delivered as HoloLens and
  iOS applications for clinical and educational users.'
